<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Résultats · Questionnaire AW Parfumerie</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Mrs+Saint+Delafield&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="entete">
    <span class="marque"><span class="script">AW</span> Parfumerie</span>
  </header>

  <main class="page page-large">
    <div class="admin-tete">
      <div>
        <p class="surtitre">Questionnaire « Le parfum et vous »</p>
        <h1>Résultats</h1>
      </div>
      <div class="admin-outils">
        <button class="btn btn-trait" id="actualiser">Actualiser</button>
        <a class="btn btn-prune" href="export.csv" download>Télécharger (Excel)</a>
      </div>
    </div>

    <div class="chiffres">
      <div class="chiffre"><span>Participations</span><strong id="total">–</strong></div>
      <div class="chiffre"><span>Dernière réponse</span><strong class="petit" id="derniere">–</strong></div>
    </div>

    <p class="erreur" id="erreur" role="alert" hidden></p>
    <div class="resultats" id="resultats" aria-live="polite"></div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
